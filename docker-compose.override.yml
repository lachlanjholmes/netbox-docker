version: '3.4'
services:
  netbox:
    image: netbox:latest-plugins
    pull_policy: never
    build:
      context: .
      dockerfile: Dockerfile-Plugins
    ports:
    - 8080:8080
    healthcheck:
      retries: 15
  netbox-worker:
    image: netbox-latest-plugins
    pull_policy: never
  netbox-housekeeping:
    image: netbox-latest-plugins
    pull_policy: never
